services:
  f1-playback:
    build: .
    container_name: f1_playback_system
    stdin_open: true
    tty: true
    volumes:
      - ./.fastf1_cache:/app/.fastf1_cache
    environment:
      - OSC_IP=host.docker.internal
      - OLLAMA_HOST=http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    container_name: ollama_service
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
